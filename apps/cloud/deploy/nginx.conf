# Install under /etc/nginx/sites-available/ after the certificate is issued.
# Keep any existing IP rehearsal virtual host in its separate file.
server {
    listen 80;
    server_name api.siteforsk.ink;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.siteforsk.ink$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.siteforsk.ink;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/api.siteforsk.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.siteforsk.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:scoreboard_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    client_body_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.siteforsk.ink;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }
}
